<title>Pour Gabrielle</title>
<style>
  /* Ciel 3D compatible partout (Three.js chargé à l'ancienne). Couronne d'étoiles dorées qui se trace, prénom + lettre. Grain + vignette cinéma. */
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&display=swap');
  :root{
    --ink:#05060c;--cream:#efe6d6;--gold:#e9c784;--gold-soft:#caa968;--muted:#8a8498;
    --ease:cubic-bezier(.32,.72,0,1);
    --font-letter:'Cormorant Garamond', Georgia, serif;--font-script:'Great Vibes', cursive;
    color-scheme:dark;
  }
  html,body{height:100%;margin:0}
  body{background:var(--ink);color:var(--cream);font-family:var(--font-letter);overflow:hidden;position:fixed;inset:0}
  #sky{position:fixed;inset:0;z-index:0;display:block}
  body::before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:overlay;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 34%, transparent 44%, rgba(3,4,9,.8) 100%)}

  .stage{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center;padding:clamp(40px,46vh,520px) 26px max(28px,env(safe-area-inset-bottom,0px));pointer-events:none}
  .name{font-family:var(--font-script);font-size:clamp(3.6rem,16vw,7.2rem);line-height:.9;
    text-shadow:0 0 40px rgba(233,199,132,.5),0 0 10px rgba(233,199,132,.45);
    color:transparent;-webkit-text-fill-color:transparent;
    background-image:linear-gradient(100deg,#caa968,#ffe9b8 25%,#e9c784 50%,#caa968 75%);background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;
    opacity:0;transform:translateY(10px) scale(.97);filter:blur(10px);
    transition:opacity 2.4s var(--ease),transform 2.4s var(--ease),filter 2.4s var(--ease)}
  .name.show{opacity:1;transform:none;filter:blur(0);animation:sheen 6.5s linear infinite}
  @keyframes sheen{to{background-position:220% center}}
  .eyebrow{margin-top:1.1em;font-size:clamp(.62rem,2.6vw,.78rem);letter-spacing:.42em;text-transform:uppercase;color:var(--gold-soft);
    opacity:0;transition:opacity 2s var(--ease)}
  .eyebrow.show{opacity:.85}
  #letter{max-width:34rem;width:100%;margin-top:clamp(1.6rem,5vh,3rem);display:flex;flex-direction:column;gap:.1em}
  #letter .line{font-size:clamp(1.2rem,4.8vw,1.7rem);line-height:1.5;color:var(--cream);
    opacity:0;transform:translateY(16px);filter:blur(7px);
    transition:opacity 1.9s var(--ease),transform 1.9s var(--ease),filter 1.9s var(--ease);text-wrap:balance}
  #letter .line.em{font-style:italic;color:#e9dcc6}
  #letter .line.gold{color:var(--gold);font-style:italic}
  #letter .line.sign{font-size:clamp(.95rem,3.4vw,1.15rem);color:var(--muted);font-style:italic;margin-top:.9em}
  #letter .line.show{opacity:1;transform:none;filter:blur(0)}

  #start{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    text-align:center;padding:26px;background:radial-gradient(120% 90% at 50% 44%,rgba(30,22,40,.35),rgba(5,6,12,.96) 72%);
    transition:opacity 1.6s var(--ease)}
  #start.hide{opacity:0;pointer-events:none}
  #start .pre{font-style:italic;color:#efe6d6cc;font-size:clamp(1.05rem,4.4vw,1.5rem);max-width:24rem;line-height:1.5}
  #start .go{display:inline-flex;align-items:center;gap:.8em;cursor:pointer;
    font-family:var(--font-letter);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.82rem,3.4vw,.95rem);
    color:#efe6d6;background:rgba(233,199,132,.06);border:1px solid rgba(233,199,132,.35);
    padding:14px 16px 14px 26px;border-radius:999px;transition:transform .6s var(--ease),background .6s var(--ease),border-color .6s var(--ease)}
  .go .orb{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;
    background:linear-gradient(140deg,#f3dca2,var(--gold));color:#2a1d0c;font-size:1rem;transition:transform .6s var(--ease)}
  #start .go:hover{transform:translateY(-2px);background:rgba(233,199,132,.12);border-color:rgba(233,199,132,.6)}
  #start .go:hover .orb{transform:translateX(3px) scale(1.06)}
  #start .go:active{transform:scale(.98)}
  #start .go:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  #start .sub{color:#ffffff6e;font-size:.78rem;letter-spacing:.1em}
  #replay{position:fixed;z-index:4;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom,0px));text-align:center;opacity:0;transition:opacity 1.6s var(--ease)}
  #replay.show{opacity:1}
  #replay button{background:none;border:1px solid rgba(233,199,132,.3);color:var(--gold);font-family:var(--font-letter);
    font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;padding:9px 22px;border-radius:999px;cursor:pointer;transition:background .5s var(--ease)}
  #replay button:hover{background:rgba(233,199,132,.1)}
  @media (prefers-reduced-motion:reduce){.name,.eyebrow,#letter .line{transition:opacity .4s ease;filter:none;transform:none}}
</style>

<canvas id="sky"></canvas>
<div class="stage">
  <div class="name" id="nm">Gabrielle</div>
  <div class="eyebrow" id="eb">sa constellation · le 14 novembre</div>
  <div id="letter"></div>
</div>
<div id="replay"><button id="replayBtn">la revoir</button></div>
<div id="start">
  <div class="pre">Gabrielle… lève les yeux un instant.</div>
  <button class="go" id="goBtn"><span>ouvrir</span><span class="orb">✦</span></button>
  <div class="sub">🔊 son activé · installe-toi</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  if(!window.THREE){ return; }
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ===== TES MOTS — remplace par ta vraie lettre ===== */
  var LETTER=[
    { text:"Gabrielle," },
    { text:"j'ai cherché ta place dans le ciel…", cls:"em" },
    { text:"et j'ai trouvé une couronne." },
    { text:"Forcément. Une princesse, ça se reconnaît. 👑", cls:"gold" },
    { text:"Joyeux anniversaire, ma belle." },
    { text:"— rien que pour toi", cls:"sign" }
  ];

  var canvas=document.getElementById('sky');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x05060c);
  scene.fog=new THREE.FogExp2(0x05060c,0.0032);
  var camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,2000);
  camera.position.set(0,10,120);
  var look=new THREE.Vector3(0,12,0);

  function disc(){var s=64,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d');
    var gr=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'#fff');gr.addColorStop(.35,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gr;x.beginPath();x.arc(s/2,s/2,s/2,0,6.28);x.fill();return new THREE.CanvasTexture(c);}
  var sprite=disc();

  function starLayer(n,spread,depth,size,col,op){
    var geo=new THREE.BufferGeometry();var pos=new Float32Array(n*3);
    for(var i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*spread;pos[i*3+1]=(Math.random()-.5)*spread*0.7+12;pos[i*3+2]=-depth-Math.random()*depth;}
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    var m=new THREE.PointsMaterial({size:size,map:sprite,color:col,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
    var p=new THREE.Points(geo,m);scene.add(p);return p;
  }
  var farStars=starLayer(1300,520,180,1.4,0xaeb4d8,0.85);
  var nearStars=starLayer(380,320,60,2.2,0xdfe6ff,0.95);

  function nebula(hex,x,y,z,sc,op){var s=256,c=document.createElement('canvas');c.width=c.height=s;var g2=c.getContext('2d');
    var gr=g2.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,hex+'cc');gr.addColorStop(.45,hex+'3a');gr.addColorStop(1,hex+'00');
    g2.fillStyle=gr;g2.fillRect(0,0,s,s);
    var m=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending});
    var sp=new THREE.Sprite(m);sp.position.set(x,y,z);sp.scale.set(sc,sc,1);scene.add(sp);return sp;}
  var nebulas=[nebula('#6a4bd6',-140,40,-260,420,.3),nebula('#d6568f',150,-10,-300,460,.26),nebula('#e0a24e',20,70,-240,360,.24)];

  var dustGeo=new THREE.BufferGeometry();var DUST=140;var dpos=new Float32Array(DUST*3);
  for(var d0=0;d0<DUST;d0++){dpos[d0*3]=(Math.random()-.5)*170;dpos[d0*3+1]=(Math.random()-.5)*110+12;dpos[d0*3+2]=20+Math.random()*70;}
  dustGeo.setAttribute('position',new THREE.BufferAttribute(dpos,3));
  var dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({size:1.1,map:sprite,color:0xe9c784,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));scene.add(dust);

  // couronne : chaîne de points dorés lumineux (lueur sans post-traitement)
  var CROWN=[[-0.95,0.28,0],[-0.62,-0.42,2.2],[-0.33,0.06,0],[0,-0.62,3.4],[0.33,0.06,0],[0.62,-0.42,2.2],[0.95,0.28,0]];
  var S=34,CY=12;
  var crownGroup=new THREE.Group();scene.add(crownGroup);
  var base=CROWN.map(function(p){return new THREE.Vector3(p[0]*S,CY-p[1]*S,p[2]);});
  var smooth=[];var SUB=46;
  for(var i2=0;i2<base.length-1;i2++){for(var k=0;k<SUB;k++){var t=k/SUB;smooth.push(base[i2].clone().lerp(base[i2+1],t));}}
  smooth.push(base[base.length-1].clone());
  var total=smooth.length;
  var trailGeo=new THREE.BufferGeometry().setFromPoints(smooth);
  var trail=new THREE.Points(trailGeo,new THREE.PointsMaterial({size:2.7,map:sprite,color:0xe9c784,transparent:true,opacity:.95,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
  trail.geometry.setDrawRange(0,0);crownGroup.add(trail);
  var nodeGeo=new THREE.BufferGeometry().setFromPoints(base);
  var nodeMat=new THREE.PointsMaterial({size:4.2,map:sprite,color:0xfff1d6,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  crownGroup.add(new THREE.Points(nodeGeo,nodeMat));
  var jewGeo=new THREE.BufferGeometry().setFromPoints([base[1],base[3],base[5]]);
  var jewMat=new THREE.PointsMaterial({size:8,map:sprite,color:0xffe6b0,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  crownGroup.add(new THREE.Points(jewGeo,jewMat));

  // étoiles filantes
  var shooters=[];
  function spawnShooter(){var geo=new THREE.BufferGeometry();
    var head=new THREE.Vector3((Math.random()-.15)*170,40+Math.random()*34,-30-Math.random()*70);
    var dir=new THREE.Vector3(-1-Math.random(),-0.5-Math.random()*0.4,0).normalize();
    var tail=head.clone().addScaledVector(dir,-20);geo.setFromPoints([tail,head]);
    var mat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
    var line=new THREE.Line(geo,mat);scene.add(line);
    shooters.push({line:line,head:head,dir:dir,life:0,dur:1.1+Math.random()*0.5,speed:95+Math.random()*60});}
  var nextShoot=2.5;
  function updateShooters(dt){nextShoot-=dt;if(nextShoot<=0&&started){spawnShooter();nextShoot=3+Math.random()*4.5;}
    for(var i=shooters.length-1;i>=0;i--){var s=shooters[i];s.life+=dt;var kk=s.life/s.dur;
      s.line.material.opacity=kk<.2?kk/.2:Math.max(0,1-(kk-.2)/.8);
      s.head.addScaledVector(s.dir,s.speed*dt);var tl=s.head.clone().addScaledVector(s.dir,-20);
      s.line.geometry.setFromPoints([tl,s.head]);
      if(s.life>=s.dur){scene.remove(s.line);s.line.geometry.dispose();s.line.material.dispose();shooters.splice(i,1);}}}

  // parallaxe
  var pxv=0,pyv=0,txv=0,tyv=0;
  addEventListener('pointermove',function(e){txv=(e.clientX/innerWidth-.5);tyv=(e.clientY/innerHeight-.5);},{passive:true});

  // musique
  var actx=null,musicOn=false;
  function bell(f,st,dur,vol){var o=actx.createOscillator(),o2=actx.createOscillator(),gg=actx.createGain(),g2=actx.createGain();
    o.type='sine';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.01;
    gg.gain.setValueAtTime(0,st);gg.gain.linearRampToValueAtTime(vol,st+.03);gg.gain.exponentialRampToValueAtTime(.0001,st+dur);
    g2.gain.value=.28;o2.connect(g2);g2.connect(gg);o.connect(gg);gg.connect(actx.destination);o.start(st);o2.start(st);o.stop(st+dur+.1);o2.stop(st+dur+.1);}
  var MEL=[523.25,659.25,783.99,659.25,587.33,698.46,587.33,523.25];
  function music(){if(!actx||!musicOn)return;var t=actx.currentTime+.1,st=1.15;for(var i=0;i<MEL.length;i++)bell(MEL[i],t+i*st,2.6,.1);setTimeout(music,(MEL.length*st+1.4)*1000);}
  function ping(){if(actx)bell(880+Math.random()*140,actx.currentTime+.01,1.8,.055);}

  // lettre
  var box=document.getElementById('letter'),timer;
  function reveal(){
    box.innerHTML='';document.getElementById('replay').classList.remove('show');
    document.getElementById('nm').classList.remove('show');document.getElementById('eb').classList.remove('show');
    var ns=LETTER.map(function(it){var el=document.createElement('div');el.className='line'+(it.cls?' '+it.cls:'');el.textContent=it.text;box.appendChild(el);return el;});
    setTimeout(function(){document.getElementById('nm').classList.add('show');},3500);
    setTimeout(function(){document.getElementById('eb').classList.add('show');ping();},4000);
    var i=0;function next(){if(i>=ns.length){document.getElementById('replay').classList.add('show');return;}ns[i].classList.add('show');ping();i++;timer=setTimeout(next,2600);}
    clearTimeout(timer);timer=setTimeout(next,4700);
  }

  var started=false,startAt=0;
  function begin(){try{actx=new (window.AudioContext||window.webkitAudioContext)();musicOn=true;music();}catch(e){}
    started=true;startAt=performance.now();
    var s=document.getElementById('start');s.classList.add('hide');setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1700);reveal();}
  document.getElementById('goBtn').addEventListener('click',begin);
  document.getElementById('replayBtn').addEventListener('click',function(){started=true;startAt=performance.now();reveal();});

  var clock=new THREE.Clock();
  function ease(t){return t<0?0:t>1?1:1-Math.pow(1-t,3);}
  function frame(){
    requestAnimationFrame(frame);
    var dt=clock.getDelta(),t=clock.elapsedTime;
    farStars.rotation.z=t*0.006;nearStars.rotation.z=t*0.012;
    dust.rotation.y=t*0.02;dust.position.y=Math.sin(t*0.2)*2;
    for(var j=0;j<nebulas.length;j++)nebulas[j].material.opacity=0.22+0.08*Math.sin(t*0.3+j);
    crownGroup.rotation.z=Math.sin(t*0.3)*0.02;crownGroup.rotation.y=Math.sin(t*0.22)*0.05;
    updateShooters(dt);
    var camZ=120;
    if(started){var e=(performance.now()-startAt)/1000;
      camZ=120-28*ease(Math.min(1,e/3.2));
      var p=ease(Math.min(1,Math.max(0,(e-0.7)/2.6)));
      trail.geometry.setDrawRange(0,Math.floor(p*total));nodeMat.opacity=p*0.95;jewMat.opacity=p;}
    if(reduce&&started){trail.geometry.setDrawRange(0,total);nodeMat.opacity=.95;jewMat.opacity=1;}
    pxv+=(txv-pxv)*0.04;pyv+=(tyv-pyv)*0.04;
    camera.position.x+=((pxv*26)-camera.position.x)*0.05;
    camera.position.y+=((10-pyv*16)-camera.position.y)*0.05;
    camera.position.z+=(camZ-camera.position.z)*0.05;
    camera.lookAt(look);
    renderer.render(scene,camera);
  }
  frame();

  addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
